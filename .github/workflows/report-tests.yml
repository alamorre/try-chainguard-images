name: Report tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'reportlab>=4.4,<5'
      - run: python -m unittest discover -s tests -v
